<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You! — Bookly</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #fffdf9;
      color: #241b12;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      max-width: 480px;
    }
    .emoji {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Baloo 2', sans-serif;
      color: #1f7a34;
      font-size: 32px;
      margin-bottom: 12px;
    }
    p {
      font-size: 17px;
      color: #6b5d4f;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      background: #2f9e44;
      color: #fff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎉</div>
    <h1>Thank You!</h1>
    <p>Check your inbox — your free coloring pages are on the way! If you don't see it in a few minutes, check your spam folder.</p>
    <a class="btn" href="/">Browse More Coloring Books</a>
  </div>
</body>
</html>
