<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Thank You — Bookly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1a1a;
  --muted:#5c5c5c;
  --bg:#ffffff;
  --bg-soft:#f7f5f2;
  --orange:#ea6a4a;
  --orange-dark:#d85233;
  --teal:#2f6f62;
  --line:#e6e3dd;
  --radius:10px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg-soft);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
}
h1,.display{
  font-family:'Poppins',sans-serif;
  font-weight:600;
  letter-spacing:-0.01em;
  margin:0;
}
.card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  max-width:460px;width:100%;padding:40px 32px;text-align:center;
  box-shadow:0 10px 30px rgba(20,18,16,0.08);
}
.check{
  width:56px;height:56px;border-radius:50%;background:var(--teal);
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
}
.check svg{width:28px;height:28px;}
h1{font-size:24px;margin-bottom:10px;}
p{color:var(--muted);font-size:15px;margin:0 0 26px;}
.btn{
  display:inline-block;background:var(--orange);color:#fff;text-decoration:none;
  padding:14px 30px;border-radius:28px;font-weight:700;font-size:15px;border:none;
}
.btn:hover{background:var(--orange-dark);}
.note{
  margin-top:22px;font-size:13px;color:var(--muted);
}
.note a{color:var(--teal);font-weight:600;text-decoration:none;}
.note a:hover{text-decoration:underline;}
.missing{
  border:1px dashed var(--line);border-radius:var(--radius);padding:20px;
  background:var(--bg-soft);color:var(--muted);font-size:14.5px;
}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="check">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 13l4 4L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>Thanks for your order!</h1>
  <p id="productLine">Your PDF is ready to download.</p>
  <div id="downloadArea"></div>
  <div class="note">
    Trouble downloading? Email <a href="mailto:hello@example.com">hello@example.com</a> and we'll send it over.
  </div>
</div>

<script>
// Map each product key to its actual file and display name.
// Add a line here every time a new product gets a real PDF file,
// using the same key from that product's data-product attribute.
const PRODUCT_FILES = {
  puzzlebook: { name: "Fun Brain Games for Little Thinkers", file: "files/puzzlebook.pdf" }
  // toddler:  { name: "My First Toddler Coloring Book", file: "files/toddler.pdf" },
  // woodland: { name: "Woodland Friends", file: "files/woodland.pdf" },
  // pipmomo:  { name: "Pip & Momo and the Rainbow Trail", file: "files/pipmomo.pdf" },
  // halloween:{ name: "Halloween: Trick, Treat & Color", file: "files/halloween.pdf" }
};

const params = new URLSearchParams(window.location.search);
const key = params.get('product');
const product = PRODUCT_FILES[key];
const downloadArea = document.getElementById('downloadArea');
const productLine = document.getElementById('productLine');

if(product){
  productLine.textContent = product.name + ' is ready to download.';
  downloadArea.innerHTML = '<a class="btn" href="' + product.file + '" download>Download your PDF</a>';
} else {
  productLine.textContent = "We couldn't find that download automatically.";
  downloadArea.innerHTML = '<div class="missing">No problem — just email us at hello@example.com with your receipt and we\'ll send your PDF right away.</div>';
}
</script>

</body>
</html>
